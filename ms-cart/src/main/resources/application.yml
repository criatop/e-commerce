server:
  port: 9025

spring:
  application:
    name: ms-cart
  datasource:
    url: jdbc:postgresql://localhost:5433/cart_db
    username: postgres
    password: "123"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
