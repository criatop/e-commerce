networks:
  ecommerce-network:
    name: ecommerce-network

volumes:
  postgres_data:

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multi-db:/docker-entrypoint-initdb.d
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  eureka-server:
    build: ./eureka
    image: ecommerce-eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api-gateway:
    build: { context: ./, dockerfile: api-gateway/Dockerfile }
    image: ecommerce-api-gateway
    container_name: api-gateway
    ports:
      - "9000:9000"
    depends_on:
      eureka-server: { condition: service_healthy }
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - ecommerce-network

  ms-auth:
    build: ./ms-auth
    image: ecommerce-ms-auth
    container_name: ms-auth
    depends_on:
      postgres-db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - ecommerce-network

  ms-product:
    build: ./ms-product
    image: ecommerce-ms-product
    container_name: ms-product
    depends_on:
      postgres-db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/products_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - ecommerce-network

  ms-cart:
    build: ./ms-cart
    image: ecommerce-ms-cart
    container_name: ms-cart
    depends_on:
      postgres-db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/cart_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - ecommerce-network

  ms-order:
    build: ./ms-order
    image: ecommerce-ms-order
    container_name: ms-order
    depends_on:
      postgres-db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/order_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - ecommerce-network

  ms-payment:
    build: ./ms-payment
    image: ecommerce-ms-payment
    container_name: ms-payment
    depends_on:
      postgres-db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/payment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - ecommerce-network

  ms-shipping:
    build: ./ms-shipping
    image: ecommerce-ms-shipping
    container_name: ms-shipping
    depends_on:
      postgres-db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/shipping_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - ecommerce-network

  ms-content:
    build: ./ms-content
    image: ecommerce-ms-content
    container_name: ms-content
    depends_on:
      postgres-db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/content_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - ecommerce-network

  frontend:
    build:
      context: ./frontend-react
      args:
        VITE_API_URL: http://localhost:9000
    image: ecommerce-frontend
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    networks:
      - ecommerce-network
