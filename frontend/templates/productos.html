{% extends "base.html" %}
{% block title %}Catálogo de Accesorios · Pink &amp; Pink{% endblock %}

{% block content %}
<section class="container-section">
  <h1 class="section-title">Catálogo de Accesorios</h1>

  <div class="row g-3 mb-4 bg-pink-panel p-3 rounded-4 shadow-sm">
    <div class="col-md-8">
      <div class="input-group">
        <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
        <input type="text" id="buscadorProductos" class="form-control border-0" placeholder="Buscar accesorio por nombre...">
      </div>
    </div>
    <div class="col-md-4">
      <select id="filtroCategoria" class="form-select border-0"></select>
    </div>
  </div>

  <div class="row g-4" id="catalogoContenedor"></div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/storage.js') }}"></script>
<script src="{{ url_for('static', filename='js/carrito.js') }}"></script>
<script src="{{ url_for('static', filename='js/productos.js') }}"></script>
{% endblock %}
