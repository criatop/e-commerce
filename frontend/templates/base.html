<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo%} Accesorios Chic{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css')}}">
</head>
<body>

  <header class="header">
    <div class="header-contenido">
      <a href="{{ url_for('home') }}" class="logo">Accesorios Chic</a>

      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>

      <nav class="menu" id="menuPrincipal">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="#">Productos</a>
        <a href="#">Blogs</a>
        <a href="#">Nosotros</a>
        <a href="#">Contacto</a>
        <a href="#">Login</a>
        <a href="#" class="carrito-icono">
          🛒 <span class="badge" id="badgeCarrito">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="contenido">
    {% block content %}
    <p>Contenido de la página...</p>
    {% endblock %}
  </main>

  <footer class="footer">
    <p>&copy; 2026 Accesorios Chic. Todos los derechos reservados.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/carrito.js') }}"></script>
</body>
</html>
