<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Pink &amp; Pink · Accesorios Chic{% endblock %}</title>

<!-- Fuentes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

<!-- Bootstrap 5 (para el panel admin y tablas) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- DataTables CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.11/css/dataTables.bootstrap5.min.css">

<!-- CSS propio (rosa) -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">

{% block extra_css %}{% endblock %}
</head>
<body>

<!-- Barra superior -->
<div class="topbar">Envíos a todo Chile ♥</div>

<!-- Barra de navegación -->
{% include '_navbar.html' %}

<!-- Contenido de cada página -->
<main class="auth-page-shell">
  {% block content %}{% endblock %}
</main>

<!-- Pie de página -->
{% include '_footer.html' %}

<!-- Scripts base -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.11/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.11/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Lógica común de almacenamiento / sesión -->
<script src="{{ url_for('static', filename='js/storage.js') }}"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
