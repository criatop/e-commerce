{% extends "base.html" %}

{% block title %}Mi cuenta · Pink &amp; Pink{% endblock %}

{% block content %}
<section class="container-section">
  <div class="container">
    <div class="text-center mb-4">
      <h1 class="section-title">Mi cuenta</h1>
      <a href="{{ url_for('productos') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Seguir comprando
      </a>
    </div>

    <div id="contenidoCuenta" class="row justify-content-center g-4"></div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
function cargarCuenta() {
    const contenedor = document.getElementById("contenidoCuenta");
    if (!contenedor) return;

    const sesion = obtenerSesion();

    if (!sesion) {
        contenedor.innerHTML = '<div class="col-12">' +
            '<div class="text-center p-5 bg-pink-panel rounded-4">' +
            '<h3 class="fw-bold text-accent mb-3">Aún no has iniciado sesión</h3>' +
            '<p class="text-muted mb-4">Inicia sesión para ver tu información personal.</p>' +
            '<a href="{{ url_for('login') }}" class="btn btn-accent px-4 py-2 fw-semibold">Iniciar sesión</a>' +
            '</div>' +
            '</div>';
        return;
    }

    const rol = obtenerColeccion(CHIC_KEYS.roles).find(function (r) { return r.id === sesion.rolId; });
    const region = obtenerColeccion(CHIC_KEYS.regiones).find(function (r) { return r.id === sesion.regionId; });
    const comuna = obtenerColeccion(CHIC_KEYS.comunas).find(function (c) { return c.id === sesion.comunaId; });

    const esStaff = sesion.rolId === 1 || sesion.rolId === 2;
    const iniciales = (sesion.nombre + " " + sesion.apellidos).split(" ").slice(0, 2).map(function (p) { return p.charAt(0); }).join("").toUpperCase();

    function fila(etiqueta, valor) {
        return '<div class="d-flex justify-content-between align-items-center border-bottom py-2">' +
            '<span class="text-muted small">' + etiqueta + '</span>' +
            '<span class="fw-semibold text-end">' + (valor || "-") + '</span>' +
            '</div>';
    }

    let html =
        '<div class="col-lg-8">' +
        '<div class="card-nexo-hover p-4">' +
        '<div class="row g-4 align-items-center">' +

        '<div class="col-md-4 text-center">' +
        '<div class="avatar-iniciales">' + iniciales + '</div>' +
        '<h2 class="h5 mt-3 mb-1">' + sesion.nombre + ' ' + sesion.apellidos + '</h2>' +
        '<span class="badge ' + (esStaff ? 'text-bg-danger' : 'text-bg-secondary') + ' rounded-pill">' + (rol ? rol.nombre : "Usuario") + '</span>' +
        (esStaff
            ? '<div class="mt-3"><a href="{{ url_for('admin') }}" class="btn btn-accent w-100"><i class="bi bi-speedometer2 me-1"></i> Ir al panel admin</a></div>'
            : '') +
        '<div class="mt-2">' +
        '<button type="button" class="btn btn-outline-danger w-100" onclick="cerrarSesion()">' +
        '<i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión' +
        '</button>' +
        '</div>' +
        '</div>' +

        '<div class="col-md-8">' +
        '<div class="ps-md-3">' +
        fila("Correo", sesion.correo) +
        fila("RUN", sesion.run) +
        fila("Fecha de nacimiento", sesion.fechaNacimiento) +
        fila("Dirección", sesion.direccion) +
        fila("Región", region ? region.nombre : "") +
        fila("Comuna", comuna ? comuna.nombre : "") +
        fila("Estado", sesion.estado) +
        '</div>' +
        '</div>' +

        '</div>' +
        '</div>' +
        '</div>';

    contenedor.innerHTML = html;
}

document.addEventListener("DOMContentLoaded", function () {
    cargarCuenta();
});
</script>

<style>
.avatar-iniciales {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: var(--pink-primary);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 1px;
}
</style>
{% endblock %}
