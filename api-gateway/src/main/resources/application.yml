server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: route-ms-auth
          uri: lb://ms-auth
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/roles/**, /api/v1/regions/**, /api/v1/comunas/**

        - id: route-ms-product
          uri: lb://ms-product
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**, /api/v1/favorites/**

        - id: route-ms-cart
          uri: lb://ms-cart
          predicates:
            - Path=/api/v1/cart/**

        - id: route-ms-order
          uri: lb://ms-order
          predicates:
            - Path=/api/v1/orders/**

        - id: route-ms-payment
          uri: lb://ms-payment
          predicates:
            - Path=/api/v1/payments/**

        - id: route-ms-shipping
          uri: lb://ms-shipping
          predicates:
            - Path=/api/v1/shipping/**

        - id: route-ms-content
          uri: lb://ms-content
          predicates:
            - Path=/api/v1/news/**, /api/v1/contact/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
